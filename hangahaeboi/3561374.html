      const staticrypt = window.staticryptInitiator.init(staticryptConfig, templateConfig);
      window.addEventListener("load", async function () {
        const result = await staticrypt.handleDecryptOnLoad();
        if (!result.isSuccessful) {
          let path = location.pathname;
          if (path.endsWith("/")) path += "index.html";
          const here = path.split("/").slice(-2).join("/");
          location.replace("../index.html?next=" + encodeURIComponent(here));
        }
      });
    </script>
  </body>
</html>
